syntax = "proto3";

package com.payroll.payslip.proto;

option java_multiple_files = true;
option java_package = "com.payroll.payslip.proto";

message SalarySlip {
  int64 id = 1;
  int64 year = 2;
  string month = 3;
  string filePath = 4;
}

message GetSalarySlip {
  int64 id = 1;
}

message GetSalarySlipResponse {
  int64 id = 1;
  int64 year = 2;
  string month = 3;
  string filePath = 4;
}

service SalarySlipDataService {
  rpc GetSalarySlipById(GetSalarySlip) returns (GetSalarySlipResponse);
}